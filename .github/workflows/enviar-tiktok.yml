# Posta no TikTok, pela API oficial, o vídeo que o "Gerar vídeo" guardou na Release "video-<pasta>".
# Legenda: youtube/tiktok.txt do kit. Confere o publicados.json antes e anota o ID depois.
# Enquanto o app do TikTok não for auditado, o vídeo sai como "somente eu".
name: Enviar ao TikTok

on:
  workflow_dispatch:
    inputs:
      pasta:
        description: "Pasta do Short (ex.: shorts/estados-1)"
        required: true
        type: string

concurrency:
  group: publicacao
  cancel-in-progress: false

permissions:
  contents: write  # para gravar o publicados.json

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PASTA: ${{ inputs.pasta }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Baixar o vídeo gerado na nuvem
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          slug=$(echo "$PASTA" | sed 's#\\#/#g; s#^/*##; s#/*$##; s#/#-#g')
          mkdir -p "baixado/$slug"
          gh release download "video-$slug" --dir "baixado/$slug" --pattern '*.mp4' --pattern 'kit-youtube.zip'
          unzip -q "baixado/$slug/kit-youtube.zip" -d "baixado/$slug/youtube"
          echo "MP4=$(ls baixado/$slug/*.mp4 | head -1)" >> "$GITHUB_ENV"
          echo "LEGENDA=baixado/$slug/youtube/tiktok.txt" >> "$GITHUB_ENV"

      - name: Enviar
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: python automacao/tiktok.py publicar "$PASTA" "$MP4" "$LEGENDA"

      # Roda mesmo se algo falhar depois do envio, para o ID nunca se perder.
      - name: Gravar no publicados.json
        if: always()
        run: |
          git diff --quiet publicados.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publicados.json
          git commit -m "TikTok: $PASTA enviado"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
