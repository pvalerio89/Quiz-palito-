# Posta no TikTok, pela API oficial, o vídeo que o "Gerar vídeo" guardou na Release "video-<pasta>".
# Legenda: youtube/tiktok.txt do kit. Confere o publicados.json antes e anota o ID depois.
# Modo "rascunho" (padrão): o vídeo vai para a caixa de entrada do TikTok; o dono abre a notificação,
# cola a legenda (aparece no resumo da execução) e publica. Modo "direto" só funciona com o app auditado.
name: Enviar ao TikTok

on:
  workflow_dispatch:
    inputs:
      pasta:
        description: "Pasta do Short (ex.: shorts/estados-1)"
        required: true
        type: string
      modo:
        description: "rascunho (você publica pelo celular) ou direto (só depois da aprovação do TikTok)"
        required: true
        default: rascunho
        type: choice
        options: [rascunho, direto]
  workflow_call:   # usado pelo "Publicar do dia" logo depois do Short sair no YouTube
    inputs:
      pasta:
        required: true
        type: string
      modo:
        required: false
        default: rascunho
        type: string

concurrency:
  group: publicacao
  cancel-in-progress: false

permissions:
  contents: write  # para gravar o publicados.json

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PASTA: ${{ inputs.pasta }}
      MODO: ${{ inputs.modo || 'rascunho' }}
    steps:
      # Versão mais nova da branch (tiktok.txt já com o link do vídeo longo, publicados.json atualizado).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Baixar o vídeo gerado na nuvem
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          slug=$(echo "$PASTA" | sed 's#\\#/#g; s#^/*##; s#/*$##; s#/#-#g')
          mkdir -p "baixado/$slug"
          gh release download "video-$slug" --dir "baixado/$slug" --pattern '*.mp4' --pattern 'kit-youtube.zip'
          unzip -q "baixado/$slug/kit-youtube.zip" -d "baixado/$slug/youtube"
          echo "MP4=$(ls baixado/$slug/*.mp4 | head -1)" >> "$GITHUB_ENV"
          # Prefere a legenda do repositório (já com o link do vídeo longo); senão, a do kit.
          leg="$PASTA/youtube/tiktok.txt"; [ -f "$leg" ] || leg="baixado/$slug/youtube/tiktok.txt"
          echo "LEGENDA=$leg" >> "$GITHUB_ENV"
          echo "SLUG=$slug" >> "$GITHUB_ENV"

      - name: Enviar
        env:
          TIKTOK_CLIENT_KEY: ${{ vars.TIKTOK_CLIENT_KEY || secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: |
          if [ "$MODO" = "direto" ]; then
            python automacao/tiktok.py publicar "$PASTA" "$MP4" "$LEGENDA"
          else
            python automacao/tiktok.py rascunho "$PASTA" "$MP4"
            { echo "### Abra a notificação no app do TikTok e cole esta legenda"; echo; echo '```'; cat "$LEGENDA"; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Legenda fácil de copiar pelo celular: notas da Release do Short.
      - name: Legenda nas notas da Release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "$LEGENDA" ] || exit 0
          { echo "Legenda do TikTok (copie e cole no app):"; echo; grep -viE "youtu|LINK_DO_VIDEO_LONGO|Canal:" "$LEGENDA"; } > notas.md
          gh release edit "video-$SLUG" --notes-file notas.md || true

      # Roda mesmo se algo falhar depois do envio, para o ID nunca se perder.
      - name: Gravar no publicados.json
        if: always()
        run: |
          git diff --quiet publicados.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publicados.json
          git commit -m "TikTok: $PASTA enviado"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
