# Gera um vídeo ou Short na nuvem, com os mesmos scripts usados no PC.
# Roda em Windows para ter as fontes Segoe UI / Segoe UI Emoji do padrão visual atual.
# Prévia: entrega as imagens da prancha. Completo: entrega o mp4 + kit e guarda numa Release
# "video-<pasta>", de onde saem o envio ao YouTube e o arquivo para o TikTok (sem renderizar de novo).
name: Gerar vídeo

on:
  workflow_dispatch:
    inputs:
      pasta:
        description: "Pasta do vídeo (ex.: videos/06-quiz-brasil ou shorts/brasil-1)"
        required: true
        type: string
      modo:
        description: "previa = só a prancha; completo = vídeo + kit"
        required: true
        default: previa
        type: choice
        options: [previa, completo]
  workflow_call:   # usado pelo "Publicar do dia"
    inputs:
      pasta:
        required: true
        type: string
      modo:
        required: false
        default: completo
        type: string

concurrency:
  group: gerar-${{ inputs.pasta }}
  cancel-in-progress: false

permissions:
  contents: write  # para criar a Release com o vídeo

jobs:
  gerar:
    runs-on: windows-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: pwsh
        working-directory: Quiz Palito
    env:
      PASTA: ${{ inputs.pasta }}
      MODO: ${{ inputs.modo }}
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      # Os scripts procuram a pasta raiz pelo nome "Quiz Palito"; por isso o checkout vai para essa pasta.
      - uses: actions/checkout@v4
        with:
          path: Quiz Palito

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: Quiz Palito/requirements.txt

      - name: Instalar pacotes e ffmpeg
        run: |
          python -m pip install -r requirements.txt
          # 2026-11-24: o site do Chocolatey caiu (timeout) e o vídeo do dia não saiu.
          # Agora: tenta o choco com tempo curto; se falhar, baixa o ffmpeg pronto do GitHub (BtbN).
          choco install ffmpeg -y --no-progress --execution-timeout=600 --timeout=120
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            Write-Host "Chocolatey falhou: baixando o ffmpeg do GitHub"
            $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
            $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
            for ($i = 1; $i -le 4; $i++) {
              try { Invoke-WebRequest -Uri $url -OutFile $zip -TimeoutSec 300; break }
              catch { Write-Host "tentativa $i falhou: $_"; Start-Sleep -Seconds (15 * $i) }
            }
            Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg" -Force
            $bin = (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
            $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            $env:PATH = "$bin;$env:PATH"
          }
          ffmpeg -version | Select-Object -First 1

      - name: Nome da pasta
        id: nome
        run: |
          $slug = $env:PASTA.Trim().Trim('/','\').Replace('\','/').Replace('/','-')
          "slug=$slug" >> $env:GITHUB_OUTPUT

      - name: Gerar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}  # só os vídeos 01 e 02 usam
        run: |
          if ($env:MODO -eq 'previa') { python automacao/gerar.py "$env:PASTA" --previa } else { python automacao/gerar.py "$env:PASTA" }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Guardar resultado (7 dias)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.nome.outputs.slug }}-${{ inputs.modo }}
          path: Quiz Palito/saida/${{ steps.nome.outputs.slug }}
          retention-days: 7

      - name: Guardar vídeo na Release (para YouTube e TikTok)
        if: inputs.modo == 'completo'
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ steps.nome.outputs.slug }}
        run: |
          $dir = "saida/$env:SLUG"
          $info = Get-Content "$dir/info.json" -Raw | ConvertFrom-Json
          Compress-Archive -Path "$dir/youtube/*" -DestinationPath "$dir/kit-youtube.zip" -Force
          $notas = "$dir/notas.md"
          "Gerado na nuvem em $(Get-Date -Format 'yyyy-MM-dd HH:mm') (commit $env:GITHUB_SHA)." | Out-File $notas -Encoding utf8
          "" | Out-File $notas -Append -Encoding utf8
          if (Test-Path "$dir/youtube/tiktok.txt") {
            "Legenda do TikTok:" | Out-File $notas -Append -Encoding utf8
            Get-Content "$dir/youtube/tiktok.txt" -Raw | Out-File $notas -Append -Encoding utf8
          }
          $tag = "video-$env:SLUG"
          $arquivos = @("$dir/$($info.mp4)", "$dir/kit-youtube.zip")
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @arquivos --clobber
            gh release edit $tag --notes-file $notas
          } else {
            gh release create $tag @arquivos --prerelease --target $env:GITHUB_SHA --title "Vídeo $env:PASTA" --notes-file $notas
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Resumo
        if: always()
        env:
          SLUG: ${{ steps.nome.outputs.slug }}
        run: |
          $f = "saida/$env:SLUG/info.json"
          if (Test-Path $f) {
            '```json' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Get-Content $f -Raw | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
