# Envia ao YouTube o vídeo que o "Gerar vídeo" guardou na Release "video-<pasta>".
# Padrão: PÚBLICO direto (preferência do Patrick). Confere o publicados.json antes e anota o ID depois.
name: Enviar ao YouTube

on:
  workflow_dispatch:
    inputs:
      pasta:
        description: "Pasta do vídeo (ex.: shorts/brasil-1)"
        required: true
        type: string
      privacidade:
        description: "publico = já vai ao ar; privado = só você vê"
        required: true
        default: publico
        type: choice
        options: [publico, privado]
      longo:
        description: "Só para Short: pasta do vídeo longo (troca LINK_DO_VIDEO_LONGO pelo link dele)"
        required: false
        type: string
      agendar:
        description: "Opcional: hora UTC em que o YouTube solta o vídeo (ex.: 2026-11-11T06:00:00Z = 3h de Brasília)"
        required: false
        type: string
  workflow_call:   # usado pelo "Publicar do dia"
    inputs:
      pasta:
        required: true
        type: string
      privacidade:
        required: false
        default: publico
        type: string
      longo:
        required: false
        type: string
      agendar:
        required: false
        type: string

concurrency:
  group: publicacao   # um envio/registro por vez, para não duplicar
  cancel-in-progress: false

permissions:
  contents: write  # para gravar o publicados.json

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PASTA: ${{ inputs.pasta }}
      PRIVACIDADE: ${{ inputs.privacidade }}
      LONGO: ${{ inputs.longo }}
      AGENDAR: ${{ inputs.agendar }}
    steps:
      # Pega a versão mais nova da branch (inclui o ID do vídeo longo gravado minutos antes).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Baixar o vídeo gerado na nuvem
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          slug=$(echo "$PASTA" | sed 's#\\#/#g; s#^/*##; s#/*$##; s#/#-#g')
          mkdir -p "baixado/$slug"
          gh release download "video-$slug" --dir "baixado/$slug" --pattern '*.mp4' --pattern 'kit-youtube.zip'
          unzip -q "baixado/$slug/kit-youtube.zip" -d "baixado/$slug/youtube"
          echo "MP4=$(ls baixado/$slug/*.mp4 | head -1)" >> "$GITHUB_ENV"

      - name: Enviar
        env:
          YT_CLIENT_ID: ${{ vars.YT_CLIENT_ID || secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python automacao/publicar_youtube.py "$PASTA" "$MP4" $([ "$PRIVACIDADE" = publico ] && echo --publico) ${LONGO:+--longo "$LONGO"} ${AGENDAR:+--agendar "$AGENDAR"}

      # Roda mesmo se algo falhar depois do envio, para o ID nunca se perder.
      - name: Gravar no publicados.json
        if: always()
        run: |
          git diff --quiet publicados.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publicados.json
          git commit -m "YouTube: $PASTA enviado ($PRIVACIDADE)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
