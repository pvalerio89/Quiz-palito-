# Nova autorização do YouTube com permissão para comentários (e envio de vídeos), sem usar o PC.
# 1) Rode sem endereço: o resumo mostra o link. 2) Abra, entre na conta do canal Quiz Palito e aceite.
# 3) A página final "não abre" (127.0.0.1): copie o endereço inteiro e rode de novo colando no campo.
# 4) O resumo mostra o novo valor para o Secret YT_REFRESH_TOKEN. Depois apague a execução.
name: Autorizar YouTube

on:
  workflow_dispatch:
    inputs:
      endereco:
        description: "Endereço da página depois do login (vazio = pegar o link)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  autorizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      YT_CLIENT_ID: ${{ vars.YT_CLIENT_ID || secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      ENDERECO: ${{ inputs.endereco }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Link ou troca do código
        run: |
          if [ -z "$ENDERECO" ]; then
            { echo "### Abra este link e autorize com a conta do Quiz Palito"; echo; python automacao/comentarios_youtube.py link; } >> "$GITHUB_STEP_SUMMARY"
          else
            python automacao/comentarios_youtube.py trocar "$ENDERECO"
          fi
