# Troca a miniatura de vídeos que já subiram (ex.: miniatura nova feita no Google Flow).
name: Trocar miniatura

on:
  workflow_dispatch:
    inputs:
      pastas:
        description: "Pastas separadas por espaço (ex.: videos/21-jogador-pela-foto videos/22-capitais)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  trocar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Trocar miniatura no YouTube
        env:
          YT_CLIENT_ID: ${{ vars.YT_CLIENT_ID || secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PASTAS: ${{ inputs.pastas }}
        run: python automacao/trocar_miniatura.py $PASTAS
